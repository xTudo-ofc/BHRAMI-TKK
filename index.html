<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="pt-BR">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BHRAMI Web Radio — transmissão ao vivo.">
  <title>BHRAMI — Web Radio</title>

  <style type="text/css">
    :root {
      --ink: #101a2c;
      --blue: #2445ea;
      --aqua: #50e2dc;
      --paper: #f6f7ff;
      --muted: #64708a;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #page {
      position: relative;
      display: grid;
      min-height: 100vh;
      padding: 28px clamp(24px, 6vw, 96px) 42px;
      isolation: isolate;
      overflow: hidden;
    }

    #page:before,
    #page:after {
      position: absolute;
      z-index: -1;
      border-radius: 999px;
      content: "";
      filter: blur(1px);
    }

    #page:before {
      width: min(55vw, 760px);
      aspect-ratio: 1;
      top: -20%;
      right: -12%;
      background: radial-gradient(circle at 30% 30%, #a0f8ed 0 5%, var(--aqua) 33%, #a7b9ff 69%, transparent 70%);
      opacity: .75;
    }

    #page:after {
      width: min(44vw, 620px);
      aspect-ratio: 1;
      bottom: -30%;
      left: -15%;
      background: radial-gradient(circle at 65% 35%, #94a7ff, var(--blue) 50%, transparent 71%);
      opacity: .14;
    }

    #top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: max-content;
    }

    .brand {
      color: var(--ink);
      font-size: 1.15rem;
      font-weight: 850;
      letter-spacing: .18em;
      text-decoration: none;
    }

    .tag {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 90px;
      padding: 11px 15px;
      border-radius: 5px;
      color: #fff;
      background: var(--ink);
      font-size: .77rem;
      font-weight: 700;
      letter-spacing: .11em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background .2s ease, transform .2s ease;
    }

    .tag:hover { background: var(--blue); transform: translateY(-2px); }

    #content {
      display: flex;
      align-items: center;
      max-width: 870px;
      padding: 66px 0;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--blue);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(3.5rem, 9vw, 7.3rem);
      font-weight: 850;
      letter-spacing: -.075em;
      line-height: .86;
    }

    h1 span { color: var(--blue); }

    .copy {
      max-width: 510px;
      margin: 28px 0 34px;
      color: var(--muted);
      font-size: clamp(1.05rem, 1.7vw, 1.22rem);
      line-height: 1.65;
    }

    .copy p { margin: 0; }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px 15px 23px;
      border-radius: 999px;
      color: #fff;
      background: var(--ink);
      box-shadow: 0 12px 30px rgba(16, 26, 44, .18);
      font-size: .95rem;
      font-weight: 750;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .button:after {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      color: var(--ink);
      background: var(--aqua);
      content: "▶";
      font-size: .76rem;
      transition: transform .2s ease;
    }

    .button:hover {
      background: var(--blue);
      box-shadow: 0 16px 36px rgba(36, 69, 234, .28);
      transform: translateY(-3px);
    }

    .button:hover:after { transform: scale(1.08); }
    .button:focus { outline: 3px solid var(--aqua); outline-offset: 4px; }
    .tag:focus { outline: 3px solid var(--aqua); outline-offset: 5px; }

    #player-wrap {
      display: none;
      width: min(100%, 510px);
      margin-top: 24px;
      padding: 8px;
      border: 1px solid rgba(36, 69, 234, .09);
      border-radius: 15px;
      background: rgba(255, 255, 255, .75);
      box-shadow: 0 14px 35px rgba(28, 45, 94, .10);
    }

    #radio-player {
      display: block;
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 9px;
      background: #fff;
    }

    #bottom {
      display: flex;
      align-items: end;
      justify-content: space-between;
      color: var(--muted);
      font-size: .77rem;
    }

    .line {
      width: min(18vw, 230px);
      height: 1px;
      background: currentColor;
      opacity: .45;
    }

    @media (max-width: 560px) {
      #page { min-height: 100svh; }
      #content { padding: 42px 0; }
      h1 { font-size: clamp(3.2rem, 17vw, 5rem); }
      #bottom { gap: 18px; }
      .line { width: 64px; }
    }
  </style>
</head>

<body>
  <div id="page">
    <div id="top">
      <a class="brand" href="#inicio" title="BHRAMI, início">BHRAMI</a>
      <a class="tag" href="#ouvir">AO VIVO</a>
    </div>

    <div id="content">
      <div>
        <p class="eyebrow">BHRAMI WEB STATION</p>
        <h1 id="inicio">Aproveite a programação <span>BHRAMI Web Radio!</span></h1>
        <div class="copy">
          <p>Transmissão ao vivo disponível para ouvir gratuitamente.</p>
        </div>

        <a id="ouvir" class="button" href="https://radio.bhrami.win/1by1.mp3" target="radio-player" onclick="document.getElementById('player-wrap').style.display='block';" title="Tocar a BHRAMI Web Radio ao vivo">toque aqui para ouvir a BHRAMI.</a>

        <div id="player-wrap">
          <iframe id="radio-player" name="radio-player" src="about:blank" title="Reprodutor da BHRAMI Web Radio">Seu navegador não consegue abrir a transmissão aqui. <a href="https://radio.bhrami.win/1by1.mp3">Abra a BHRAMI Web Radio</a>.</iframe>
        </div>
      </div>
    </div>

    <div id="bottom">
      <span>2026 BHRAMI</span>
      <span class="line"></span>
      <span>Rádio Amadorismo Mundo Inteiro</span>
    </div>
  </div>
</body>
</html>
